<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let n = parseInt(prompt("Nhập số lượng số nguyên tố cần in: "));
    let count = 0; 
    let num = 2;   

    while (count < n) {
      let check = true;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
          check = false;
          break;
        }
      }
      if (check) {
        document.write(num + " ");
        count++;
      }
      num++;
    }
  </script>
</body>
</html>
