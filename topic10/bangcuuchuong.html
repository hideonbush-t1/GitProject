<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    table {
      border-collapse: collapse;
      width: 100%;
      text-align: center;
    }
    th, td {
      border: 1px solid black;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h2>Bảng cửu chương</h2>
  <table>
    <tr>
    <script>
      for (let j = 1; j <= 10; j++) {
        document.write("<tr>");
        for (let i = 1; i <= 9; i++) {
          document.write("<td>" + i + " x " + j + " = " + (i * j) + "</td>");
        }
        document.write("</tr>");
      }
    </script>
    </tr>
  </table>
</body>
</html>
